name: Test ListPro Core
on:
  push:
    paths: ['listpro-core/**']
  pull_request:
    paths: ['listpro-core/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: listpro-core
      - run: npm run benchmark
        working-directory: listpro-core
